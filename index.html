<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Culture Hub</title>
<style>
:root{--bg:#F3F5FB;--card:#fff;--ink:#0B1030;--mute:#5A6285;--line:#D8DDEE;--gold:#FFC928;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1030;--card:#141C4A;--ink:#F5F7FA;--mute:#A9B2D6;--line:#2A3470}}
:root[data-theme="dark"]{--bg:#0B1030;--card:#141C4A;--ink:#F5F7FA;--mute:#A9B2D6;--line:#2A3470}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 20px/1.35 system-ui,'Segoe UI',Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 24px}
h1{font-size:34px;margin:0 auto 0 0;line-height:1.1}
h2{font-size:26px;margin:0 0 10px}
.btn{background:var(--gold);color:#14100A;border:0;border-radius:10px;padding:12px 22px;font-weight:800;box-shadow:0 4px 0 #A67C00}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.s{padding:8px 14px;font-size:17px}
main{padding:0 24px 32px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.team{border-top:12px solid var(--c)}
.tn{font-size:30px;font-weight:900;color:var(--c);filter:brightness(.92)}
.big{font-size:84px;font-weight:900;line-height:1;margin:4px 0}
.bar{height:16px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c)}
.mute{color:var(--mute);font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-size:16px;margin:3px 4px 3px 0}
.chip.on{background:var(--c);border-color:var(--c);color:#14100A}
.chip.off{opacity:.45}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.gem{font-size:46px}
input,textarea{font:inherit;width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 12px}
textarea{min-height:170px;resize:vertical}
label{display:block;font-size:17px;color:var(--mute);margin:8px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hist{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(5,7,26,.78);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
.modal{max-width:900px;width:100%;max-height:100%;overflow:auto}
.flash{text-align:center;padding:24px;border-top:14px solid var(--c)}
.flash h2{font-size:50px;color:var(--c);margin:4px 0;filter:brightness(.92)}
.flash b{font-size:76px;display:block;line-height:1.1;animation:pop .6s both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.ok{color:#1F9D55}
@media(max-width:900px){.g3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
'use strict';
const K='classCulture.v1',COL=['#FF3B4E','#2F8CFF','#FFC928'],LV=[[0,'Rookie'],[20,'Bronze'],[50,'Silver'],[100,'Gold'],[200,'Champion']];
const mk=n=>({name:n,teams:[{name:'Red Rockets',s:''},{name:'Blue Thunder',s:''},{name:'Gold Strikers',s:''}],log:[]});
const def=()=>({sel:0,pin:'',goal:5,games:[{n:'Class Cup',e:'⚽',need:15,u:'',d:'Penalty, free kick and target rounds'},{n:'Memory Vault',e:'🧠',need:30,u:'',d:'Flash it, remember it, recall it'},{n:'Trivia Trap',e:'🕵️',need:50,u:'',d:'Tricky questions with a catch'}],classes:[mk('Class 1'),mk('Class 2')]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
if(!S||!S.classes||!S.classes.length)S=def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const mon=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
let tab='board',unlocked=false,G=null,msg='',tdate=today(),armed=false,bk='';
const C=()=>S.classes[S.sel];
const studs=t=>t.s.split('\n').map(x=>x.trim()).filter(Boolean);
const tot=(c,i)=>c.log.reduce((a,e)=>a+(+e.p[i]||0),0);
const wk=(c,i)=>c.log.filter(e=>e.d>=mon()).reduce((a,e)=>a+(+e.p[i]||0),0);
const streak=(c,i)=>{let n=0;for(const e of c.log.slice().sort((a,b)=>b.d<a.d?-1:1)){if((+e.p[i]||0)>=S.goal)n++;else break}return n};
const level=t=>LV.filter(l=>t>=l[0]).pop()[1];
const open=(t,g)=>t>=g.need;

function board(){
  const c=C(),T=c.teams.map((_,i)=>tot(c,i)),order=T.map((t,i)=>i).sort((a,b)=>T[b]-T[a]),gs=S.games.slice().sort((a,b)=>a.need-b.need);
  const any=c.teams.some(t=>studs(t).length);
  let h=any?'':'<p class="card">Add your students first: open <b>Setup</b> and type one name per line for each team.</p>';
  h+='<div class="g3">'+c.teams.map((t,i)=>{
    const nx=gs.find(g=>g.need>T[i]),pv=gs.filter(g=>g.need<=T[i]).pop(),p0=pv?pv.need:0,pct=nx?Math.round((T[i]-p0)/(nx.need-p0)*100):100,r=order.indexOf(i);
    return `<div class="card team" style="--c:${COL[i]}"><div class="tn">${r===0&&T[i]>0?'👑 ':''}${esc(t.name)}</div><div class="big">${T[i]}</div><div class="mute">points · ${level(T[i])} · ${studs(t).length} students</div><div class="bar" style="--c:${COL[i]}"><i style="width:${pct}%"></i></div><div class="mute">${nx?(nx.need-T[i])+' more points to unlock '+esc(nx.e+' '+nx.n):'Every game unlocked! 🎉'}</div><div class="mute">This week: <b>${wk(c,i)}</b> · Streak: <b>${streak(c,i)}</b> day${streak(c,i)===1?'':'s'} at ${S.goal}+ points</div></div>`}).join('')+'</div>';
  h+='<h2>Games</h2><div class="games">'+gs.map(g=>{const gi=S.games.indexOf(g),n=c.teams.filter((_,i)=>open(T[i],g)).length;
    return `<div class="card"><div class="row"><span class="gem">${esc(g.e)}</span><div><b>${esc(g.n)}</b><div class="mute">${esc(g.d)}</div></div></div><div class="mute">Unlocks at ${g.need} points</div><div>${c.teams.map((t,i)=>`<span class="chip ${open(T[i],g)?'on':'off'}" style="--c:${COL[i]}">${open(T[i],g)?'✓':'🔒'} ${esc(t.name)}</span>`).join('')}</div><p><button class="btn" data-a="play" data-v="${gi}" ${n?'':'disabled'}>▶ Play</button></p></div>`}).join('')+'</div>';
  return h;
}
function tally(){
  const c=C(),ex=c.log.find(e=>e.d===tdate),hist=c.log.slice().sort((a,b)=>b.d<a.d?-1:1);
  return `<div class="card"><h2>End-of-day points</h2><label>Date</label><input type="date" id="td" data-f="td" value="${tdate}">${ex?'<p class="mute">A tally already exists for this day. Saving will replace it.</p>':''}<div class="g3">${c.teams.map((t,i)=>`<div><label style="color:${COL[i]};filter:brightness(.9)">${esc(t.name)} total today</label><input type="number" id="p${i}" value="${ex?ex.p[i]:0}"></div>`).join('')}</div><div class="row"><button class="btn" data-a="savet">Save day</button><button class="btn g" data-a="undo" ${c.log.length?'':'disabled'}>Undo last entry</button><span class="ok">${msg}</span></div></div><div class="card" style="margin-top:18px"><h2>History</h2>${hist.length?hist.map((e,k)=>`<div class="hist"><span>${e.d}</span><span>${c.teams.map((t,i)=>esc(t.name)+': <b>'+e.p[i]+'</b>').join(' · ')}</span><button class="btn g s" data-a="del" data-v="${c.log.indexOf(e)}">Delete</button></div>`).join(''):'<p class="mute">No days saved yet.</p>'}</div>`;
}
function setup(){
  const c=C();
  return `<div class="card"><h2>${esc(c.name)}</h2><label>Class name</label><input data-f="cn" value="${esc(c.name)}"><div class="g3" style="margin-top:14px">${c.teams.map((t,i)=>`<div><label style="color:${COL[i]};filter:brightness(.9)">Team ${i+1} name</label><input data-f="tn:${i}" value="${esc(t.name)}"><label>Students, one per line (${studs(t).length})</label><textarea data-f="ts:${i}">${esc(t.s)}</textarea></div>`).join('')}</div></div>
  <div class="card" style="margin-top:18px"><h2>Games and unlock points</h2>${S.games.map((g,i)=>`<div class="row" style="margin-bottom:10px"><input style="width:70px" data-f="g:${i}:e" value="${esc(g.e)}"><input style="flex:2;min-width:160px" data-f="g:${i}:n" value="${esc(g.n)}"><input type="number" style="width:110px" data-f="g:${i}:need" value="${g.need}"><input style="flex:3;min-width:220px" placeholder="Game link (paste the published link)" data-f="g:${i}:u" value="${esc(g.u)}"><button class="btn g s" data-a="delg" data-v="${i}">✕</button></div>`).join('')}<button class="btn g" data-a="addg">+ Add game</button><p class="mute">Order: emoji, name, points needed to unlock, game link. Points never get spent; a game stays unlocked once a team reaches its number.</p></div>
  <div class="card" style="margin-top:18px"><h2>Settings</h2><div class="row"><div><label>Streak goal (points per day)</label><input type="number" data-f="goal" value="${S.goal}"></div><div><label>Teacher PIN (blank = none)</label><input data-f="pin" value="${esc(S.pin)}"></div></div></div>
  <div class="card" style="margin-top:18px"><h2>Backup</h2><p class="mute">Data lives in this browser on this smart board. Copy the backup text somewhere safe, paste it back to restore.</p><textarea id="bk">${esc(bk)}</textarea><div class="row" style="margin-top:10px"><button class="btn g" data-a="exp">Show backup</button><button class="btn g" data-a="imp">Restore from text</button><button class="btn g" data-a="reset">${armed?'Tap again: erase ALL points for this class':'New season (erase points for this class)'}</button><span class="ok">${msg}</span></div></div>`;
}
function modal(){
  if(!G)return '';
  const c=C(),g=S.games[G.g],T=c.teams.map((_,i)=>tot(c,i));
  let h='<div class="ov"><div class="card modal">';
  if(G.flash){
    const t=c.teams[G.t],nm=studs(t),names=G.sel.map(i=>nm[i]).filter(Boolean);
    h+=`<div class="flash" style="--c:${COL[G.t]}"><div class="mute">${esc(g.e+' '+g.n)} · ${G.mode==='solo'?'Solo':'Team play'}</div><h2>${esc(t.name)}</h2><b>${esc(names.join(' & '))}</b><h2 style="color:var(--ink)">Come on down!</h2><div class="row" style="justify-content:center">${g.u?'<button class="btn" data-a="gopen">Open game ▶</button>':'<span class="mute">Add this game\'s link in Setup to launch it here.</span>'}<button class="btn g" data-a="gback">Back</button><button class="btn g" data-a="gclose">Close</button></div></div>`;
  }else{
    h+=`<h2>${esc(g.e+' '+g.n)}</h2><label>Which team?</label><div>${c.teams.map((t,i)=>`<button class="btn ${G.t===i?'on':'g'}" data-a="gt" data-v="${i}" ${open(T[i],g)?'':'disabled'}>${open(T[i],g)?'':'🔒 '}${esc(t.name)}</button> `).join('')}</div>`;
    if(G.t!==null){
      const nm=studs(c.teams[G.t]);
      h+=`<label>Who is playing?</label><div class="row"><button class="btn ${G.mode==='solo'?'on':'g'} s" data-a="gm" data-v="solo">Solo</button><button class="btn ${G.mode==='team'?'on':'g'} s" data-a="gm" data-v="team">Team (several)</button></div><div style="margin-top:8px">${nm.length?nm.map((n,i)=>`<span style="white-space:nowrap"><button class="chip ${G.sel.includes(i)?'on':''} ${G.abs.includes(i)?'off':''}" style="--c:${COL[G.t]}" data-a="gs" data-v="${i}">${esc(n)}</button><button class="chip" data-a="ga" data-v="${i}" title="Mark absent">${G.abs.includes(i)?'↩':'🚫'}</button></span>`).join(''):'<p class="mute">No students on this team yet. Add them in Setup.</p>'}</div><p class="mute">🚫 marks a student absent for this round.</p>`;
    }
    h+=`<div class="row" style="margin-top:12px">${G.t!==null?`<button class="btn" data-a="grand">🎲 ${G.mode==='solo'?'Pick a random student':'Pick random students'}</button><button class="btn" data-a="gstart" ${G.sel.length?'':'disabled'}>Start</button>`:''}<button class="btn g" data-a="gclose">Cancel</button></div>`;
  }
  return h+'</div></div>';
}
function render(){
  const c=C(),gate=tab!=='board'&&S.pin&&!unlocked;
  let h=`<div class="top"><h1>🏆 Class Culture Hub</h1>${S.classes.map((x,i)=>`<button class="btn ${i===S.sel?'on':'g'}" data-a="cls" data-v="${i}">${esc(x.name)}</button>`).join('')}<span style="width:14px"></span>${[['board','Board'],['tally','End-of-day'],['setup','Setup']].map(t=>`<button class="btn ${tab===t[0]?'on':'g'}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div><main>`;
  if(gate)h+=`<div class="card"><h2>Teacher PIN</h2><div class="row"><input id="pin" type="password" style="max-width:240px" placeholder="PIN"><button class="btn" data-a="pin">Unlock</button><span class="ok">${msg}</span></div></div>`;
  else h+=tab==='board'?board():tab==='tally'?tally():setup();
  document.getElementById('app').innerHTML=h+'</main>'+modal();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,c=C();msg='';
  if(a==='tab'){tab=v;armed=false}
  else if(a==='cls'){S.sel=+v;save();armed=false}
  else if(a==='pin'){const x=document.getElementById('pin').value;if(x===S.pin)unlocked=true;else msg='Wrong PIN'}
  else if(a==='savet'){const d=document.getElementById('td').value||tdate,p=c.teams.map((_,i)=>+document.getElementById('p'+i).value||0);c.log=c.log.filter(x=>x.d!==d);c.log.push({d,p});tdate=d;save();msg='Saved ✓'}
  else if(a==='undo'){const l=c.log.slice().sort((x,y)=>y.d<x.d?-1:1)[0];c.log=c.log.filter(x=>x!==l);save();msg='Last entry removed'}
  else if(a==='del'){c.log.splice(+v,1);save()}
  else if(a==='addg'){S.games.push({n:'New game',e:'🎮',need:60,u:'',d:''});save()}
  else if(a==='delg'){S.games.splice(+v,1);save()}
  else if(a==='exp'){bk=JSON.stringify(S)}
  else if(a==='imp'){try{const o=JSON.parse(document.getElementById('bk').value);if(!o.classes)throw 0;S=o;save();msg='Restored ✓'}catch(x){msg='That text is not a valid backup'}}
  else if(a==='reset'){if(armed){c.log=[];save();armed=false;msg='Points erased'}else armed=true}
  else if(a==='play'){G={g:+v,t:null,mode:'solo',sel:[],abs:[],flash:false}}
  else if(G){
    if(a==='gt'){G.t=+v;G.sel=[];G.abs=[]}
    else if(a==='gm'){G.mode=v;if(v==='solo')G.sel=G.sel.slice(0,1)}
    else if(a==='gs'){const i=+v;if(!G.abs.includes(i)){if(G.mode==='solo')G.sel=[i];else G.sel=G.sel.includes(i)?G.sel.filter(x=>x!==i):G.sel.concat(i)}}
    else if(a==='ga'){const i=+v;G.abs=G.abs.includes(i)?G.abs.filter(x=>x!==i):G.abs.concat(i);G.sel=G.sel.filter(x=>!G.abs.includes(x))}
    else if(a==='grand'){const pool=studs(c.teams[G.t]).map((_,i)=>i).filter(i=>!G.abs.includes(i));if(pool.length){if(G.mode==='solo')G.sel=[pool[Math.floor(Math.random()*pool.length)]];else G.sel=pool.sort(()=>Math.random()-.5).slice(0,Math.max(2,Math.ceil(pool.length/2)));G.flash=true}}
    else if(a==='gstart'){if(G.sel.length)G.flash=true}
    else if(a==='gback'){G.flash=false}
    else if(a==='gopen'){const u=S.games[G.g].u;if(u)window.open(u,'_blank','noopener')}
    else if(a==='gclose'){G=null}
  }
  render();
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f;if(!f)return;const p=f.split(':'),v=e.target.value,c=C();
  if(p[0]==='td')tdate=v||tdate;
  else if(p[0]==='cn')c.name=v.trim()||c.name;
  else if(p[0]==='tn')c.teams[+p[1]].name=v.trim()||c.teams[+p[1]].name;
  else if(p[0]==='ts')c.teams[+p[1]].s=v;
  else if(p[0]==='g')S.games[+p[1]][p[2]]=p[2]==='need'?Math.max(0,+v||0):v;
  else if(p[0]==='goal')S.goal=Math.max(1,+v||5);
  else if(p[0]==='pin')S.pin=v.trim();
  save();render();
});
render();
})();
</script>
</body>
</html>
